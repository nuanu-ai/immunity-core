title: "GenAI Process Accessing Sensitive Files"
id: "c0136397-f82a-45e5-9b9f-a3651d77e21a"
status: "test"
description: "Detects when GenAI tools access sensitive files such as cloud credentials, SSH keys, browser password databases, or\nshell configurations. Attackers leverage GenAI agents to systematically locate and exfiltrate credentials, API keys, and\ntokens. Access to credential stores (.aws/credentials, .ssh/id_*) suggests harvesting, while writes to shell configs\n(.bashrc, .zshrc) indicate persistence attempts. Note: On linux only creation events are available. Access events are\nnot yet implemented."
references: ["https://github.com/elastic/detection-rules/blob/032ac5ecb0b4035a12b03dd25164e2fbcfae9fad/rules/cross-platform/credential_access_genai_process_sensitive_file_access.toml"]
author: "Elastic"
license: "Elastic License v2"
date: "2025-12-04"
modified: "2026-09-25"
tags: ["attack.t1005", "attack.t1037.004", "attack.t1552.001", "attack.t1555"]
logsource: {"product": "macos", "category": "file_event"}
detection:
  s1: {"event.action|cased": ["open", "creation", "modification"]}
  s2: {"event.outcome|cased": ["success"]}
  s3: {"process.name": ["ollama.exe", "ollama", "textgen.exe", "textgen", "text-generation-webui.exe", "oobabooga.exe", "lmstudio.exe", "lmstudio", "LM Studio", "claude.exe", "claude", "cursor.exe", "cursor", "copilot.exe", "copilot", "codex.exe", "codex", "jan.exe", "jan", "gpt4all.exe", "gpt4all", "gemini-cli.exe", "gemini-cli", "gemini.exe", "genaiscript.exe", "genaiscript", "grok.exe", "grok", "qwen.exe", "qwen", "koboldcpp.exe", "koboldcpp", "llama-server", "llama-cli", "windsurf.exe", "windsurf", "zed.exe", "zed", "opencode.exe", "opencode", "goose.exe", "goose"]}
  s4: {"file.name|cased": [".bashrc", ".bash_profile", ".zshrc", ".zshenv", ".zprofile", ".profile", ".bash_logout"]}
  s5: {"file.name": ["key?.db", "logins.json", "Login Data", "Local State", "signons.sqlite", "Cookies", "cookies.sqlite", "Cookies.binarycookies", "login.keychain-db", "System.keychain", "credentials.db", "credentials", "access_tokens.db", "accessTokens.json", "azureProfile.json", "RDCMan.settings", "known_hosts", "KeePass.config.xml", "Unattended.xml"]}
  condition: "(s1 and s2 and s3 and (s4 or s5))"
level: "high"
elastic: {"rule_id": "c0136397-f82a-45e5-9b9f-a3651d77e21a", "severity": "high", "risk_score": 73, "query_sha256": "ea8910656538c7eb7c28c4da3baa10aedfda0490f5a97e1a5e7cf03e30a07627", "kinds": ["create"], "in_part_missing_fields": ["needs_events modification", "needs_events open"], "also_asks_events": [], "null_sensitive": [], "folded_fields": []}
