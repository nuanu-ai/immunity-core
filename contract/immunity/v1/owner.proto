// The person's word about a machine: that it is retired, or not theirs. The answers to `immunity
// owner`. Version 1 of the contract between the core and a program that runs it. How a message
// is printed and read, and the conventions for text, references, times and changes, are in
// `common.proto`.
//
// A statement sets a machine aside: the server check no longer visits it, and what is not read of
// it is not counted as a failure. Every statement is kept, a withdrawn one too, and one made
// outside the app is listed in the status so that none is made silently.

syntax = "proto3";

package immunity.v1;

import "immunity/v1/event.proto";
import "immunity/v1/findings.proto";
import "immunity/v1/known.proto";

// The answer to `immunity owner` without a statement: the statements that stand.
message Statements {
  // The numbers of `Failure`'s fields, so that a failure never reads as an answer.
  reserved 1000 to 1099;
  // The version of this contract: 1. A reader that meets another number stops.
  uint32 format = 1;
  int64 answered_at = 2;
  // The store this answer was read from, as in every answer (`common.proto`).
  optional string store_id = 3;
  // In the order of the name each was made under.
  repeated Statement statements = 4;
  // How many were withdrawn and are kept.
  uint64 withdrawn = 5;
  // The machines beyond this Mac that the store knows and that a statement can be made about,
  // servers first, then the person's own devices, then other people's, each kind in the order of
  // the name shown. A machine
  // set aside by a statement that stands, which nothing seen since contradicts, is in
  // `statements` and not here. Since 1.39.0.
  repeated KnownMachine machines = 6;
  // The readings on this Mac that find machines (the SSH settings, the list of machines SSH has
  // connected to, and the private network) whose latest reading was not full or was not taken by
  // the latest run that finished. One never taken is here too, made by rule: completeness
  // `none` and no `observed_at`. While one is here, `machines` may not be whole; empty means
  // each was read in full by that run. Since 1.39.0.
  repeated Coverage machines_not_read = 7;
}

// A machine beyond this Mac, as the traces on this Mac and the private network tell it apart.
// Since 1.39.0.
message KnownMachine {
  // The machine by the name it is shown by: the id the server check visited it under, else its
  // first id, without `machine:`. Whole.
  string machine_text = 1;
  // Every id the store knows it by, which `immunity machine` and `immunity owner` take. Whole.
  repeated string entities_text = 2;
  // Every other name and address the store knows it by. Whole.
  repeated string names_text = 3;
  MachineKind kind = 4;
  // The system the private network gives, for a machine that no other trace names. Whole.
  // Absent when it gives none.
  optional string system_text = 5;
  // A server known only from the private network, which does not say what system it runs: it is
  // counted as a server, and its system is not guessed.
  bool system_not_given = 6;
  // The kinds of the readings that name it, in the core's words and in their order: the readings
  // that find machines (`ssh configuration`, `known hosts`, `tailnet peers`) and the server
  // check's own (`own names and addresses`).
  repeated string known_from = 7;
}

// What a machine beyond this Mac is. `UNSPECIFIED`, or a value the reader does not know, is read
// as a server.
enum MachineKind {
  MACHINE_KIND_UNSPECIFIED = 0;
  // One the person logs in to over SSH, or one the private network shows as theirs or as the
  // network's own and does not name as a phone, a tablet, a TV or a desktop system.
  MACHINE_KIND_SERVER = 1;
  // One of the person's own phones, tablets or computers that the private network alone names
  // and that the server check cannot read.
  MACHINE_KIND_OWN_DEVICE = 2;
  // Someone else's device, which the private network alone names as another user's.
  MACHINE_KIND_OTHER_DEVICE = 3;
}

// A statement that stands.
message Statement {
  // The machine by the name the statement was made under, and its whole id, which `immunity owner`
  // takes back by. Whole.
  string machine_text = 1;
  string entity_text = 2;
  // What was said, the core's words: `retired` or `not mine`.
  string said = 3;
  // Through what it came, as an answer's `via`.
  Via via = 4;
  int64 at = 5;
  // The reason given with it, whole but for a secret cut out of it, each piece replaced by a mark
  // as in `ProgramStart.args_text`.
  string reason_text = 6;
  // Every other name and address the store knows the machine by. Whole.
  repeated string names_text = 7;
  // Something seen alive after it, which contradicts it. Absent when nothing was.
  SeenAfter seen_after = 8;
  // What was cut out of `reason_text` because it held a secret, in order, one entry for each
  // piece; `argument` is 0. A reason is cut where it is kept and again as it is read, so this is
  // always known: empty means nothing was cut. Since 1.7.0.
  repeated Cut reason_cuts = 9;
}

message SeenAfter {
  int64 at = 1;
  // What was seen. Whole.
  string what_text = 2;
}

// The answer to `immunity owner <name> retired|not-mine|withdraw`: what was said or withdrawn.
message StatementMade {
  // As in `Statements`.
  reserved 1000 to 1099;
  uint32 format = 1;
  int64 answered_at = 2;
  optional string store_id = 3;
  // The machine by the name it was asked under, and every name it is known by: the statement
  // covers it under each. Whole.
  string machine_text = 4;
  repeated string names_text = 5;
  Via via = 6;
  oneof done {
    // A statement was made.
    Said said = 7;
    // The statements that stood about the machine were withdrawn and kept.
    Withdrawn withdrawn = 8;
  }
  // The sweep script written again after it, so that no script on disk visits a machine set
  // aside.
  SweepWritten sweep = 9;
}

message Said {
  // `retired` or `not mine`.
  string said = 1;
  int64 at = 2;
  // The reason as it is kept: whole but for a secret cut out of it.
  string reason_text = 3;
  // How many statements about the same machine it replaced; they are kept.
  uint64 replaced = 4;
  // What was cut out of the reason given, as `Statement.reason_cuts`: the statement is made all
  // the same. Empty means nothing was cut. Since 1.7.0.
  repeated Cut reason_cuts = 5;
}

message Withdrawn {
  repeated WithdrawnStatement statements = 1;
}

message WithdrawnStatement {
  string machine_text = 1;
  string said = 2;
}

message SweepWritten {
  // How many servers it visits. Absent when it could not be written; then `problem_text` says
  // why, and the statement is kept all the same.
  optional uint64 servers = 1;
  optional string problem_text = 2;
}
