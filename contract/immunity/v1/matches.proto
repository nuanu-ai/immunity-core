// The rule matches the core hands over: the answer to `immunity matches`. Version 1 of the contract
// between the core and a program that runs it. How a message is printed and read, and the
// conventions for text, references, times and changes, are in `common.proto`; the rules and the
// events are in `event.proto`.
//
// The core evaluates published rules over the program starts and file events its collector
// writes to a log that lives a day: SigmaHQ's rules for macOS, and Elastic's detection rules and
// behaviour rules for macOS translated into Sigma. This answer gives every match of every rule,
// of every level and with none, each with the event it matched, in the order of the log. A match
// of a rule marked high or critical also raised a finding; the others, and those of a rule whose
// set states no level, are only counted in the store. Events that matched no rule are not given.
//
// The queue is the record the core keeps of what its evaluator concluded: a row for every match
// of every rule, in the order the evaluator wrote them, each with a number never given to another
// row. The store keeps no copy of the event: the answer reads the line again from the log at its
// place, and gives it only when it is the line the evaluator judged, by a hash the row keeps. A
// row goes with its log file when the file leaves the log. Nothing is evaluated for the answer. The caller keeps its own place: it passes `continue_after` back as `--after` to read
// on. The place is the core's own words and is opaque: a reader stores it and passes it back
// whole, and never parses or compares it. A place from another store, or one an earlier version
// printed, is refused with what to do. Rows a caller had not been given that went before it asked
// are told (`evaluated.gone`), never left out silently. Since 1.41.0; before, the answer read the
// log again from a place of its own and evaluated it.
//
// When an answer is quiet. An answer with no matches says that nothing matched only when all of
// these hold:
// - `evaluated.state` is `current`: the evaluator has read the log up to about now;
// - `collector.state` is `running`;
// - `evaluated` shows nothing lost, unreadable or gone: every count in it other than
//   `program_starts`, `file_events` and `other` is 0, and `gone` is false;
// - `collector.file_events_collected` is true;
// - no rule the reader cares about is in `unevaluated`. A rule there `in_part` is evaluated, and
//   a match of it is a match; that it did not match says nothing of the alternatives that need
//   the fields in its `fields_text`.
// Otherwise the answer says what the core did not see, and the reader does not take it for calm.
// A reader built before 1.41.0, which looks for the counts in the field `stretch`, finds none:
// for it, `collector.state` is `running` only when the answer is quiet by the conditions above
// that `evaluated` holds, and `behind` or `failed` otherwise.
// Quiet rests on `unevaluated`, which covers the lines the counts cover, and not on the lists of
// what arrives in `collector`, which are the evaluator's latest conclusion. A group that only some
// lines fill by nature, as `script` is, is judged by that conclusion alone: one start without a
// script cannot tell a program that runs none from a field the collector stopped filling. After
// the collector stops filling such a group, an answer can stay quiet until the evaluator has
// counted the group's bound, 1,000 program starts for `script`. No shipped rule reads such a
// group.
//
// Values that will be added. A reader meets values of `Raised`, `CollectorState`,
// `UnevaluatedReason` and a rule's `Level`, and those `event.proto` names, that it does not know:
// the core adds them within version 1. It treats one it does not know as something it cannot
// judge; a rule's level it does not know it reads as the highest, as `common.proto` says, and
// that level never decides whether a match raised a finding: `raised` says that.

syntax = "proto3";

package immunity.v1;

import "immunity/v1/common.proto";
import "immunity/v1/event.proto";
import "immunity/v1/verdict.proto";

// The answer to `immunity matches`.
message Matches {
  // The numbers of `Failure`'s fields, so that a failure never reads as an answer.
  reserved 1000 to 1099;
  // The version of this contract: 1. A reader that meets another number stops.
  uint32 format = 1;
  // When the answer was made.
  int64 answered_at = 2;
  // The place given with `--after`, as given. Absent when the answer starts at the oldest row
  // kept.
  optional string after = 3;
  // The matches after `after`, in the order the evaluator recorded them: the order of the log
  // within a file, and the matches of one event in the order the rules are shipped.
  repeated RuleMatch matches = 4;
  // The place to pass as `--after` next time, the core's own words: opaque, stored and passed
  // back whole.
  optional string continue_after = 5;
  // Whether matches are left after `continue_after` that this answer did not give because it
  // stopped at its limit, of matches or of bytes.
  bool more = 6;
  // 7 was `stretch`, what an answer read of the log after `after`, until 1.41.0: the answer
  // reads the log no more. `evaluated` says what the counts after `after` are now.
  reserved 7;
  reserved "stretch";
  Collector collector = 8;
  // The shipped rules that are not evaluated over these events, or only in part, each with why.
  repeated Unevaluated unevaluated = 9;
  // The store this answer was read from, as in every answer (`common.proto`): random, made once
  // when the store was made.
  optional string store_id = 10;
  // How far the evaluator has read the log, and what the lines it counted after `after` held.
  // Since 1.41.0.
  Evaluated evaluated = 11;
}

// How far the evaluator has read the log, whether it is reading it now, and what the lines it
// counted after the caller's place held. Since 1.41.0.
//
// The store keeps running totals of the counts, which only grow, and the caller's place holds the
// totals its answer reached: an answer gives the totals now less those, so the counts of answers
// read on one from another add up to the lines read, none twice and none left out, whatever the
// clock does.
//
// `state` rests on the evaluator's own writes, never on the times of the log's files: each start
// of the watcher's evaluator is a new one, and each of its writes records which one wrote,
// whether that pass reached the end of the log with nothing left to read, and when. It is
// `current` only when the last write is the evaluator the live watcher runs and reached the end,
// and either no whole line waits past where it read or it wrote within a few seconds of the
// answer. A pass that left lines to read is `behind`, however fresh its write.
message Evaluated {
  EvaluatorState state = 1;
  // Why it is behind, when `state` is `behind`.
  BehindReason behind = 2;
  // What failed, when `state` is `failed`, in the words the failure gave.
  optional string reason_text = 3;
  // When a reader of the log, the evaluator or a full check, last wrote how far it read, in seconds
  // since the epoch. Absent before any reading of the log.
  optional int64 read_until_at = 4;
  // Lines read and evaluated by the rules of their kind.
  uint64 program_starts = 5;
  uint64 file_events = 6;
  // Lines read that hold a kind of message the rules are not asked about.
  uint64 other = 7;
  // Lines that are not a message, such as a line split at the turn of an hour, or a line longer
  // than the evaluator reads: not evaluated.
  uint64 unreadable_lines = 8;
  // File events the collector or the core could not make out, such as one whose path eslogger
  // marked as cut short: not evaluated.
  uint64 unreadable_file_events = 9;
  // Program starts missing from eslogger's numbering: dropped before they reached the log, or in
  // lines deleted before they were read.
  uint64 program_starts_lost = 10;
  // Times the numbering of program starts started again, as it does when eslogger restarts: each
  // a loss of unknown size.
  uint64 program_starts_unknown_losses = 11;
  // The same for files created and renamed.
  uint64 file_events_lost = 12;
  uint64 file_events_unknown_losses = 13;
  // Log files deleted, replaced or cut short before the evaluator read them to their end, or
  // that left with that unknown: nothing in what was left of them was evaluated, and the core
  // cannot say how many lines that was.
  uint64 files_removed_unread = 14;
  // Matches after `after` went before this answer could give them: their log files left the log,
  // or became other files before the evaluator wrote them; or a log file left, also with an
  // uninstall, before it was known read to its end, so lines no reading read may have gone with
  // it; or the line of a match given here is no longer the line judged, and that match is given
  // with no event.
  bool gone = 15;
}

// Whether the evaluator has read the log up to about now.
enum EvaluatorState {
  EVALUATOR_STATE_UNSPECIFIED = 0;
  // It reads the log as it grows: whole lines written more than a few seconds ago are read.
  EVALUATOR_STATE_CURRENT = 1;
  // Lines of the log may be left that it has not read, as `behind` says why. Matches in them are
  // not in this answer yet.
  EVALUATOR_STATE_BEHIND = 2;
  // Its latest reading failed, as `reason_text` says.
  EVALUATOR_STATE_FAILED = 3;
}

// Why the evaluator is behind the log. Values are added within version 1; one the reader does not
// know is read as behind for a reason it cannot judge.
enum BehindReason {
  BEHIND_REASON_UNSPECIFIED = 0;
  // No watcher runs: the log is read only by a full check, and lines written since the latest
  // one are not read.
  BEHIND_REASON_NO_WATCHER = 1;
  // A whole line waits in the log, the evaluator has not written for more than a few seconds,
  // and a full check holds the store, which the evaluator waits for to write what it read.
  BEHIND_REASON_STORE_HELD = 2;
  // The watcher's evaluator has lines left to read: its last write did not reach the end of the
  // log, as when it reads the lines written while none read, or a backlog, or it started a moment
  // ago and has not written yet.
  BEHIND_REASON_CATCHING_UP = 3;
  // A whole line waits in the log past where the evaluator read, and it has not written for more
  // than a few seconds: it stalled.
  BEHIND_REASON_NOT_ADVANCING = 4;
}

// A published rule matched an event. A match is named by its `position` and its rule's `name`.
message RuleMatch {
  // Where the event's line is: the core's own reference, opaque, that names the generation of the
  // log file the line was read in, so it is never given to another line. Positions are not ordered
  // as text: matches come in the order of the log.
  string position = 1;
  Rule rule = 2;
  // The event on the line, read again from the log. Absent when the line could not be read
  // again, as when its file left the log a moment before; `Evaluated.gone` then says so.
  Event event = 3;
  // What became of the match among the core's findings.
  Raised raised = 4;
  // The findings the match was added to, each with its state, when `raised` is `finding`. One
  // today. A finding's state says whether the person has already answered it: a match added to a
  // finding marked `expected`, or to one marked `seen` since, raises nothing the person sees.
  // `immunity finding <id>` shows one. After them, the `verdict.suspicious` finding of the latest
  // `suspicious` verdict about the match, whatever `raised` is.
  repeated FindingRef findings = 5;
  // The response layer's verdicts about this match. The `verdict.suspicious` finding a
  // `suspicious` one went to is also among `findings`; `raised` stays what the core did. Absent
  // when there are none.
  Verdicts verdicts = 6;
}

// What became of a match among the core's findings. Values are added within version 1.
// `UNSPECIFIED`, or a value the reader does not know, is read as something it cannot judge: the
// reader judges the match itself.
enum Raised {
  RAISED_UNSPECIFIED = 0;
  // The rule is marked below high: its matches are counted and raise nothing. The reader judges
  // the match itself.
  RAISED_BELOW_HIGH = 1;
  // The core's own reading raised a finding of the match or added it to one, as `findings` says.
  RAISED_FINDING = 2;
  // 3 was `RAISED_NOT_READ_YET`, a match the core's own reading had not read yet, until 1.41.0:
  // a match is given only once the evaluator recorded it, with its finding where it raised one.
  reserved 3;
  reserved "RAISED_NOT_READ_YET";
  // The core's own reading read the line and no finding holds the match, as a build that lacked
  // the rule leaves it. The reader judges the match itself.
  RAISED_NO_FINDING = 4;
  // 5 was `RAISED_UNRECORDED`, a line read before the core kept which finding each match went to.
  // No store the core reads holds such a line.
  reserved 5;
  reserved "RAISED_UNRECORDED";
  // The rule's set states no level (its `level` is `LEVEL_NOT_STATED`): its matches are counted
  // and raise nothing by themselves. The reader judges the match itself.
  RAISED_LEVEL_NOT_STATED = 6;
}

// The collector and what it records.
message Collector {
  // Its state as its own files say at the answer, judged as a reading judges it: not installed,
  // refused, failing or silent; failed when its launch daemon is there and its log folder is not,
  // or cannot be read. Where they say it runs, `behind` or `failed` where the evaluator is
  // (`Evaluated.state`), or where what it counted after `after` is not whole; see "When an answer
  // is quiet". Only while it is `running` does a quiet answer mean that little happened.
  CollectorState state = 1;
  // What made it `refused` or `failing`: who printed it, `eslogger` or `scripts`, and the last
  // line printed.
  optional string said_by = 2;
  optional string said_text = 3;
  // When its log was last written to, as the files' times say at the answer. A time later than
  // `answered_at` is not taken as a sign that it records.
  optional int64 written_at = 4;
  // Whether the collector installed here is established to record files created and renamed.
  // When it is not, or it is not installed, the rules for file events are listed in
  // `unevaluated` with `not_collected`.
  bool file_events_collected = 5;
  // Its state as `immunity status` serves it now, from the core's own latest reading, and when
  // that reading was made; failed, with when, while the store says it runs and the watcher's
  // latest reading of it failed. Absent when the store holds no reading of it.
  optional CollectorState status_state = 6;
  optional int64 status_read_at = 7;
  // Files in the log folder that are not the collector's own, by their names: not read.
  uint64 foreign_files = 8;
  // What a collector may keep beyond what the first one kept, `identity`, `script` and
  // `signature`, each in one of five lists by what the core's latest reading stored, at
  // `status_read_at`: only a reading of every log file to its end knows which one the collector
  // is writing now, and only that file's lines say it. Kept is decided by what arrives, never by
  // a record. A rule that reads one that does not arrive is listed in `unevaluated` with
  // `not_collected`, and `detail_text` says which of the other four it is. So is a rule that reads
  // one some line counted for this answer did not give, whatever these lists say: a line without
  // its key, which the rule was not asked about, or, for `identity` and `signature`, a line with
  // the key and no value; `detail_text` then says that the lines counted for this answer did not
  // carry it.
  //
  // `not_kept`: the latest line lacks it, so the collector that wrote it is an earlier one, which
  // keeps none of them.
  repeated string not_kept = 9;
  // Lines carry it, and none read has given it a value yet.
  repeated string kept_never_filled = 10;
  // No line that would carry it has been read, as before the first line of a new install, or
  // the store holds no reading of the core's yet.
  repeated string not_yet_known = 11;
  // Lines give it a value, each with the time of the first line that did, as the lines' times
  // give it.
  repeated Arriving arriving = 12;
  // Lines gave it values and then stopped: the latest lines carry it with no value, as many in
  // a row as tell that the collector no longer fills it, one for a field every process has and a
  // thousand program starts of the file being written for `script`. Each with the time of the
  // first of them.
  repeated NoLongerArriving no_longer_arriving = 13;
}

// One of what a collector may keep that no longer arrives.
message NoLongerArriving {
  // `identity`, `script` or `signature`.
  string name = 1;
  // The time of the first of the lines in a row that gave it no value, in seconds since the
  // epoch.
  int64 since = 2;
}

// One of what a collector may keep, arriving: lines give it values.
message Arriving {
  // `identity`, `script` or `signature`.
  string name = 1;
  // The time of the first line that gave it a value since lines began to carry it, in seconds
  // since the epoch.
  int64 since = 2;
}

// The collector's states, as `immunity status` names them.
enum CollectorState {
  COLLECTOR_STATE_UNSPECIFIED = 0;
  // Its launch daemon is not installed. A limit the user can lift, not a failure.
  COLLECTOR_STATE_NOT_INSTALLED = 1;
  COLLECTOR_STATE_RUNNING = 2;
  // macOS refuses eslogger Full Disk Access.
  COLLECTOR_STATE_REFUSED = 3;
  // Its scripts print errors.
  COLLECTOR_STATE_FAILING = 4;
  // Nothing was written while the Mac was awake for 15 minutes. Time the Mac was asleep or off
  // is not counted.
  COLLECTOR_STATE_SILENT = 5;
  // The core's reading failed.
  COLLECTOR_STATE_FAILED = 6;
  // Only in `Matches.collector.state`: the evaluator has not read the log up to now, or what it
  // counted after `after` is not whole, as `Matches.evaluated` says. Since 1.41.0.
  COLLECTOR_STATE_BEHIND = 7;
}

// A shipped rule that is not evaluated over the events here, or only in part, or a rule of a
// translated set that was not taken.
message Unevaluated {
  // Its path in the shipped set; for a rule not taken, the upstream file's path under its
  // repository's `rules/` folder.
  string file = 1;
  // Its name, its set and its id as `Rule.name` gives it: `sigma:<id>`, `elastic:<rule_id>` or
  // `elastic-behaviour:<rule_id>`. Absent for a rule that could not be read.
  optional string name = 2;
  // Its `id`, `title` and level. Absent for a rule that could not be read. `level` is
  // `LEVEL_NOT_STATED` for a rule whose set states none.
  optional string id_text = 3;
  optional string title_text = 4;
  optional Level level = 5;
  UnevaluatedReason reason = 6;
  // The fields it needs that the events here do not give: for `needs_fields`, and for `in_part`
  // those of the alternatives that never match.
  repeated string fields_text = 7;
  // For `needs_events` the kind of event it is about; for `not_parsed` what the parser said; for
  // `not_collected` why the collector here is not taken to record file events, or to keep what
  // the rule reads, or that lines counted for this answer did not give it. For a rule a
  // translated set did not take, what the translation said of it, and for `in_part` what a
  // translation left out that is not a missing field, such as a pattern it could not carry.
  optional string detail_text = 8;
  // Its set, as `Rule.source` and `Rule.set` give it; present for a rule that could not be read
  // too.
  string source = 9;
  string set = 10;
}

// Why a rule judges nothing here, or only part of what it means.
enum UnevaluatedReason {
  UNEVALUATED_REASON_UNSPECIFIED = 0;
  // It is about a kind of event the collector does not record.
  UNEVALUATED_REASON_NEEDS_EVENTS = 1;
  // A selection it cannot do without needs fields the events do not give.
  UNEVALUATED_REASON_NEEDS_FIELDS = 2;
  // It searches whole messages for keywords; the core has fields, not messages.
  UNEVALUATED_REASON_KEYWORD_SEARCH = 3;
  // It could not be read.
  UNEVALUATED_REASON_NOT_PARSED = 4;
  // Evaluated, and some alternatives of its selections never match here.
  UNEVALUATED_REASON_IN_PART = 5;
  // A rule for file events, and the collector here is not installed or not established to
  // record them; or a rule that reads what the collector here does not keep, its fields in
  // `fields_text`.
  UNEVALUATED_REASON_NOT_COLLECTED = 6;
  // The four below are a translation's reasons for not taking a rule of a set translated into
  // Sigma. It correlates several events in a sequence.
  UNEVALUATED_REASON_SEQUENCE = 7;
  // It is written in a query language other than EQL, the one translated.
  UNEVALUATED_REASON_NOT_EQL = 8;
  // A part it cannot do without holds a backslash in a wildcard pattern, whose meaning in
  // Elasticsearch is not documented.
  UNEVALUATED_REASON_BACKSLASH_IN_WILDCARD = 9;
  // It is about program starts and file events at once.
  UNEVALUATED_REASON_SPANS_KINDS = 10;
  // The four below are also a translation's reasons for not taking a rule. It could never be
  // true over the events here, such as one that asks for a field no event of its kind has.
  UNEVALUATED_REASON_NEVER_TRUE = 11;
  // A part it cannot do without is a regular expression in EQL's syntax, which is not
  // translated.
  UNEVALUATED_REASON_REGEX = 12;
  // A part it cannot do without uses a function of EQL's that is not translated.
  UNEVALUATED_REASON_UNSUPPORTED = 13;
  // A part it cannot do without compares one field of the event with another, which a Sigma
  // rule cannot.
  UNEVALUATED_REASON_FUNCTION = 14;
}
